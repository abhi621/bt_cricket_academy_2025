server:
  port: 8084

spring:
  application:
    name: batch-service
  datasource:
    url: jdbc:mysql://localhost:3306/cricket_academy
    username: cricket
    password: password
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:${EUREKA_PORT:8761}/eureka/
